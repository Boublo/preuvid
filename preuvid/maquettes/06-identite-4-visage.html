<style>
body{margin:0}
a{color:#0F1F1A}a:hover{color:#47307E}

@keyframes pv-tourne{to{transform:rotate(360deg)}}
@keyframes pv-defile{to{transform:translateY(-50%)}}
@keyframes pv-pouls{50%{opacity:.25}}
.rg{transform-box:view-box;transform-origin:50% 50%;animation:pv-tourne 120s linear infinite}
.rg1{animation-duration:170s;animation-direction:reverse}
.rg2{animation-duration:80s}
.rg3{animation-duration:130s;animation-direction:reverse}
.ros{transition:transform 1.4s cubic-bezier(.2,.7,.2,1)}
.ros svg{transition:stroke .6s ease,opacity .6s ease}
.ros-zone:hover .ros{transform:rotate(28deg) scale(1.07)}
.ros-zone:hover .ros svg{stroke:#47307E;opacity:.8}
.carte{transform:rotate(-3deg);transition:transform .9s cubic-bezier(.2,.7,.2,1)}
.ros-zone:hover .carte{transform:rotate(0deg) translateY(-8px)}
.defile{animation:pv-defile 36s linear infinite}
.registre:hover .defile{animation-play-state:paused}
.ligne{transition:transform .35s cubic-bezier(.2,.7,.2,1),background-color .35s ease,color .35s ease}
.ligne:hover{transform:translateX(10px);background-color:rgba(255,255,255,.07);color:#FFFFFF}
.ligne:hover .emp{color:#C9B8FF}
.pouls{animation:pv-pouls 1.6s ease-in-out infinite}
.fl{display:inline-block;transition:transform .3s cubic-bezier(.2,.7,.2,1),color .3s ease}
.fl:hover{transform:translateX(6px);color:#FFFFFF}
.mot{font-stretch:125%;transition:font-stretch .9s cubic-bezier(.2,.7,.2,1),letter-spacing .9s cubic-bezier(.2,.7,.2,1)}
.mot:hover{font-stretch:62%;letter-spacing:.02em}
.pied:hover .ros{transform:rotate(-20deg) scale(1.05)}
@media (prefers-reduced-motion: reduce){.rg,.defile,.pouls{animation:none}.ros,.carte,.ligne,.fl,.mot{transition:none}}

@keyframes pv-monte{from{transform:scaleY(0)}}
@keyframes pv-balaye{0%,100%{top:6%}50%{top:90%}}
@keyframes pv-apparait{from{opacity:0;transform:translateY(8px)}}
@keyframes pv-tampon{0%{opacity:0;transform:rotate(-8deg) scale(2.2)}60%{opacity:1;transform:rotate(-8deg) scale(.94)}100%{opacity:1;transform:rotate(-8deg) scale(1)}}
.nv{transition:transform .3s cubic-bezier(.2,.7,.2,1),color .3s ease}
.nv:hover{transform:translateX(6px);color:#FFFFFF}
.rw{transition:background-color .25s ease}
.rw:hover{background-color:rgba(71,48,126,.08)}
.br{transform-origin:50% 100%;animation:pv-monte .9s cubic-bezier(.2,.7,.2,1) both;transition:background-color .25s ease}
.br:hover{background-color:#47307E}
.bt{transition:transform .25s cubic-bezier(.2,.7,.2,1)}
.bt:hover{transform:translate(-2px,-2px)}
.balaye{animation:pv-balaye 2.6s ease-in-out infinite}
.ap{animation:pv-apparait .6s cubic-bezier(.2,.7,.2,1) both}
.tampon{animation:pv-tampon .7s .5s cubic-bezier(.2,.7,.2,1) both}
.tour{animation:pv-tourne 18s linear infinite}
.cx{transition:transform .25s cubic-bezier(.2,.7,.2,1)}
.cx:hover{transform:translateX(6px)}
.lat:hover .ros{transform:rotate(30deg) scale(1.08)}
@media (prefers-reduced-motion: reduce){.br,.balaye,.ap,.tampon,.tour{animation:none}.nv,.rw,.bt,.cx{transition:none}}

</style>
