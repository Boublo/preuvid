# Intégration continue Preuvid (lot 0) : types, tests, construction des images.
# Actions épinglées par empreinte de commit (version en commentaire).
name: ci

on:
  push:
    branches: [main, 'lot-*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verifications:
    name: types et tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: npm
      - name: Installation (package-lock.json)
        run: npm ci --no-audit --no-fund
      - name: Paquet partagé
        run: cd shared && npx tsc && npx tsc-alias
      - name: Types
        run: |
          (cd backend && npx tsc --noEmit)
          (cd engine && npx tsc --noEmit)
          (cd frontend && npx tsc --noEmit)
      - name: Manifeste des modèles
        run: node -e "JSON.parse(require('fs').readFileSync('engine/models.manifest.json','utf8'))"
      - name: Tests backend
        run: npm test --workspace=backend
      - name: Tests moteur
        run: npm test --workspace=engine
      - name: Tests frontend
        run: npm test --workspace=frontend

  pile:
    name: images Docker et démarrage de la pile
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Moteur
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: engine/Dockerfile
          load: true
          tags: preuvid/engine:local
          cache-from: type=gha,scope=engine
          cache-to: type=gha,mode=max,scope=engine
      - name: API
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: backend/Dockerfile
          load: true
          tags: preuvid/api:local
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - name: Frontend
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: frontend
          file: frontend/Dockerfile
          build-args: VITE_EDITION=community
          load: true
          tags: preuvid/frontend:local
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
      - name: Moteur seul, sans réseau
        run: |
          docker run -d --name moteur --network none preuvid/engine:local
          for i in $(seq 1 60); do
            if docker exec moteur wget -qO- http://localhost:3002/ready; then docker rm -f moteur; exit 0; fi
            sleep 2
          done
          docker logs moteur
          exit 1
      - name: Pile complète (secrets jetables)
        run: |
          {
            echo "DB_PASSWORD=$(openssl rand -hex 32)"
            echo "JWT_SECRET=$(openssl rand -hex 32)"
            echo "API_KEY_SECRET=$(openssl rand -hex 32)"
            echo "ENCRYPTION_KEY=$(openssl rand -hex 32)"
            echo "SERVICE_TOKEN=$(openssl rand -hex 32)"
            echo "IDSWYFT_PORT=127.0.0.1:8080"
          } > .env
          docker compose up -d --wait --wait-timeout 300 || { docker compose ps; docker compose logs --tail 80; exit 1; }
          curl -sf -o /dev/null http://127.0.0.1:8080/
          docker compose ps
      - name: Arrêt
        if: always()
        run: docker compose down -v
