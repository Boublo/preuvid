# Banc de lecture, lancé à la main (environ 20 min) : construit le moteur,
# le mesure sans accès Internet et publie les scores en artefact.
name: banc

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  banc:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Moteur
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: engine/Dockerfile
          load: true
          tags: preuvid/engine:local
          cache-from: type=gha,scope=engine
      - name: Banc
        run: python3 preuvid/banc/banc.py --nom ci-${{ github.sha }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scores-banc
          path: preuvid/banc/scores/
