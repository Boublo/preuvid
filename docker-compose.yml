# ─────────────────────────────────────────────────
# Preuvid — pile locale et de production (Docker Compose)
# ─────────────────────────────────────────────────
# Les images Preuvid (moteur, API, frontend) sont construites depuis ce dépôt, jamais tirées d'un
# registre. Seules postgres (et caddy, profil https) viennent de Docker Hub : les tirer avant de
# couper le réseau.
#   cp .env.community .env        # puis remplir les secrets (voir le fichier)
#   docker compose build
#   docker compose pull --ignore-buildable   # postgres ; ajouter --profile https pour caddy
#   docker compose up -d          # fonctionne ensuite sans accès Internet
#   Ouvrir http://localhost (ou le port choisi par IDSWYFT_PORT)
#
# HTTPS (Caddy) :
#   docker compose --profile https up -d
#
# Choix Preuvid (lot 0) :
# - pas de mise à jour automatique d'images (Watchtower retiré) ;
# - aucun secret par défaut : la pile refuse de démarrer si un secret manque ;
# - le moteur et la base sont sur un réseau interne sans accès à Internet ;
#   seule l'API leur parle.
# ─────────────────────────────────────────────────

services:
  # ─────────────────────────────────────────
  # PostgreSQL
  # ─────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    mem_limit: 1g
    networks: [interne]
    volumes:
      - pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${DB_NAME:-idswyft}
      POSTGRES_USER: ${DB_USER:-idswyft}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD manquant, voir .env.community}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-idswyft} -d ${DB_NAME:-idswyft}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────
  # Moteur de lecture (OCR, visage, vivacité)
  # Modèles figés dans l'image, aucun accès réseau sortant.
  # ─────────────────────────────────────────
  engine:
    image: preuvid/engine:local
    pull_policy: never
    build:
      context: .
      dockerfile: engine/Dockerfile
    restart: unless-stopped
    mem_limit: 2g
    cpus: 2.0
    networks: [interne]
    environment:
      NODE_ENV: production
      PORT: "3002"
      LOG_LEVEL: info
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3002/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ─────────────────────────────────────────
  # API
  # ─────────────────────────────────────────
  api:
    image: preuvid/api:local
    pull_policy: never
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    mem_limit: 1g
    cpus: 1.0
    networks: [interne, externe]
    depends_on:
      postgres:
        condition: service_healthy
      engine:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "3001"
      DATABASE_URL: postgresql://${DB_USER:-idswyft}:${DB_PASSWORD:?DB_PASSWORD manquant}@postgres:5432/${DB_NAME:-idswyft}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET manquant, voir .env.community}
      API_KEY_SECRET: ${API_KEY_SECRET:?API_KEY_SECRET manquant, voir .env.community}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY manquant, voir .env.community}
      SERVICE_TOKEN: ${SERVICE_TOKEN:?SERVICE_TOKEN manquant, voir .env.community}
      CORS_ORIGINS: "${CORS_ORIGINS:-}"
      STORAGE_PROVIDER: "${STORAGE_PROVIDER:-local}"
      # Preuvid : photos chiffrées sur le disque (AES-256-GCM sous ENCRYPTION_KEY). Les anciennes, en clair, restent lisibles.
      STORAGE_ENCRYPTION: "${STORAGE_ENCRYPTION:-true}"
      AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID:-}"
      AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY:-}"
      AWS_REGION: "${AWS_REGION:-us-east-1}"
      AWS_S3_BUCKET: "${AWS_S3_BUCKET:-}"
      DATABASE_SSL: "${DATABASE_SSL:-}"
      DATABASE_SSL_REJECT_UNAUTHORIZED: "${DATABASE_SSL_REJECT_UNAUTHORIZED:-}"
      RATE_LIMIT_ENABLED: "${RATE_LIMIT_ENABLED:-true}"
      SANDBOX_MODE: ${SANDBOX_MODE:-false}
      MIGRATIONS_LENIENT: "true"
      ENGINE_URL: http://engine:3002
      # Passe majeur : domaine des clés d'accès (domaine d'essai tant que le définitif n'est pas acheté).
      PREUVID_PASSE_DOMAINE: "${PREUVID_PASSE_DOMAINE:-localhost}"
      PREUVID_PASSE_ORIGINE: "${PREUVID_PASSE_ORIGINE:-http://localhost,https://localhost}"
    volumes:
      - uploads:/app/backend/uploads
      - temp:/app/backend/temp
      - ./supabase/migrations:/app/backend/migrations:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ─────────────────────────────────────────
  # Console et parcours (fichiers statiques servis par nginx)
  # ─────────────────────────────────────────
  frontend:
    image: preuvid/frontend:local
    pull_policy: never
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_EDITION: community
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.5
    networks: [externe]
    depends_on:
      - api
    ports:
      - "${IDSWYFT_PORT:-80}:8080"

  # ─────────────────────────────────────────
  # Caddy (HTTPS, optionnel) : docker compose --profile https up -d
  # Mettre IDSWYFT_PORT=127.0.0.1:8080 dans .env pour libérer le port 80.
  # ─────────────────────────────────────────
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.5
    profiles:
      - https
    networks: [externe]
    depends_on:
      - frontend
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy/certs:/etc/caddy/certs:ro
      - caddy_data:/data
      - caddy_config:/config
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "--no-check-certificate", "https://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

networks:
  # Réseau sans passerelle vers l'extérieur : moteur et base n'atteignent pas Internet.
  interne:
    internal: true
  externe: {}

volumes:
  pgdata:
  uploads:
  temp:
  caddy_data:
  caddy_config:
