# Pass through X-Forwarded-Proto from upstream proxy (e.g. Caddy), fall back to $scheme
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

# Preuvid : journal sans Referer (la page d'un site ne doit jamais apparaître chez Preuvid).
log_format sansprovenance '$remote_addr - [$time_local] "$request" $status $body_bytes_sent "$http_user_agent"';

server {
    listen 8080;
    server_name _;
    access_log /var/log/nginx/access.log sansprovenance;
    root /usr/share/nginx/html;
    index index.html;

    # LLM agent discovery — serve markdown docs when Accept header requests plain text
    location ~ ^/docs? {
        if ($http_accept ~* "text/plain|text/markdown") {
            rewrite ^ /llms-full.txt last;
        }
        try_files $uri /index.html;
    }

    # SPA fallback — all routes serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to the backend
    # ^~ so this prefix wins over the static-asset regex location below;
    # otherwise /api/files/<id>.jpg is served from the SPA root and 404s.
    location ^~ /api/ {
        proxy_pass http://api:3001/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_cache_bypass $http_upgrade;

        # Strip Origin header — requests through this proxy are same-origin
        # by definition, so CORS checks are unnecessary. This avoids requiring
        # CORS_ORIGINS config for the standard self-hosted Docker setup.
        proxy_set_header Origin "";

        # File uploads can be large (ID documents)
        client_max_body_size 20M;
    }

    # Preuvid, passe majeur : ni journal, ni Referer, ni Origin vers l'API (double-anonymat.md).
    location ^~ /v1/age/ {
        access_log off;
        proxy_pass http://api:3001/v1/age/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header Referer "";
        proxy_set_header Origin "";
        client_max_body_size 1M;
        # Un add_header ici coupe l'héritage de ceux du serveur : l'API envoie déjà les siens
        # (helmet), dont Referrer-Policy: no-referrer, qui ne doit pas être doublée.
        add_header X-Robots-Tag "noindex" always;
    }

    # Page du passe majeur et sa page photo pour le téléphone (QR code) : pas de journal d'accès,
    # aucun Referer, rien d'extérieur, jamais dans un cadre.
    location ~ ^/age(/telephone)?$ {
        access_log off;
        try_files /age.html =404;
        add_header Cache-Control "no-cache" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    # Preuvid, page du parcours identité : état et suppression des photos (jeton dans le corps).
    location ^~ /v1/parcours/ {
        proxy_pass http://api:3001/v1/parcours/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header Referer "";
        proxy_set_header Origin "";
        client_max_body_size 1M;
        add_header X-Robots-Tag "noindex" always;
    }

    # Page du parcours identité (/verifier#jeton) : pas de journal d'accès, aucun Referer, rien
    # d'extérieur, jamais dans un cadre. La caméra n'est permise qu'à la page elle-même.
    location = /verifier {
        access_log off;
        try_files /verifier.html =404;
        add_header Cache-Control "no-cache" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-eval' 'unsafe-inline' https://docs.opencv.org; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' data: blob:" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
}
